[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glycoshift"
version = "0.3.0"
description = "Leakage-controlled cross-source CGM event warning"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "PyYAML>=6",
  "joblib>=1.3",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
deep = [
  "torch>=2.3",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
]
baselines = [
  "xgboost==3.2.0",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
