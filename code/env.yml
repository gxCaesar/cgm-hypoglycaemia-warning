name: glycoshift
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch>=2.3
  - pytorch-cuda=12.1
  - numpy>=1.26
  - pandas>=2.1
  - pyarrow>=14
  - joblib>=1.3
  - scikit-learn>=1.4
  - xgboost>=2.0
  - pyyaml>=6
  - pytest>=8
  - pip
  - pip:
      - hydra-core>=1.3
      - omegaconf>=2.3
      - ruff>=0.6
